[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
packages = ["cli"]
ci = ["github"]
dispatch-releases = true
pr-run-mode = "plan"
tag-namespace = "cli"
github-build-setup = "../dist/build-setup.yml"
hosting = "github"
installers = ["shell", "homebrew"]
tap = "Afsoon/homebrew-tap"
formula = "pgtest"
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
unix-archive = ".tar.gz"
checksum = "sha256"
source-tarball = false
publish-jobs = ["homebrew"]
publish-prereleases = false
precise-builds = true
install-path = "CARGO_HOME"
install-updater = false

# Explicit host triples let cargo-dist resolve custom runner architectures.
[dist.github-custom-runners]
global = { runner = "blacksmith-2vcpu-ubuntu-2404", host = "x86_64-unknown-linux-gnu" }
aarch64-apple-darwin = { runner = "blacksmith-6vcpu-macos-15", host = "aarch64-apple-darwin" }
aarch64-unknown-linux-musl = { runner = "blacksmith-4vcpu-ubuntu-2404-arm", host = "aarch64-unknown-linux-gnu" }
x86_64-unknown-linux-musl = { runner = "blacksmith-4vcpu-ubuntu-2404", host = "x86_64-unknown-linux-gnu" }
