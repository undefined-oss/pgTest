[package]
name = "pgtest-core"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pgtest"


[lints]
workspace = true

[dependencies]
derive_more = { workspace = true, features = ["full"] }
hotpath = { workspace = true }
rand = "0.10.2"
rustc-hash = "2.1.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
envconfig = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
pgtest-utils = { version = "=0.1.0", path = "../pgtest-utils"}
pgtest-database-operations = { version = "=0.1.0", path = "../pgtest-database-operations"}

[dev-dependencies]
tokio-postgres = "0.7.18"
futures-util = "0.3.34"
tokio = { workspace = true, features = ["test-util"] }
pgtest-database-operations = { version = "=0.1.0", path = "../pgtest-database-operations", features = ["test-support"]}

[features]
default = []
hotpath = ["hotpath/hotpath", "pgtest-database-operations/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "pgtest-database-operations/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus", "pgtest-database-operations/hotpath-prometheus"]
# Expose configuration defaults to other crates' tests.
test-support = []
