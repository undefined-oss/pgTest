[package]
name = "pgtest-core"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pgtest"


[lints]
workspace = true

[dependencies]
derive_more = { workspace = true, features = ["full"] }
envconfig = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustc-hash = "2.1.3"
papaya = "0.2.5"
pgtest-utils = { path = "../pgtest-utils" }
pgtest-engine-backend = { path = "../pgtest-engine-backend" }
hotpath = { workspace = true }
futures-util = { version = "0.3.34" }
tokio = { workspace = true }
tokio-util = { version = "0.7.19", features = ["rt"] }
pgtest-database-operations = { path = "../pgtest-database-operations" }

[features]
test-support = []
hotpath = ["hotpath/hotpath", "pgtest-database-operations/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
