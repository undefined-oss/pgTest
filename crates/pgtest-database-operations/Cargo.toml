[package]
name = "pgtest-database-operations"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pgtest-engine-backend = { path = "../pgtest-engine-backend" }
derive_more = { workspace = true, features = ["full"] }
hotpath = { workspace = true }
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
futures-util = "0.3.34"
rand = "0.10.2"
tokio-util = { version = "0.7.19", features = ["rt"] }
envconfig = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
testcontainers = { workspace = true, optional = true }
pgtest-utils = { version = "=0.2.0", path = "../pgtest-utils"}

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "sql_profiling"
required-features = ["hotpath", "test-support"]

[features]
default = []
hotpath = ["hotpath/hotpath", "hotpath/sqlx"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]
# Expose the container-backed PostgreSQL configuration to other crates' tests.
test-support = ["dep:testcontainers"]
