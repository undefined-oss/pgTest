name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.repository == 'undefined-oss/pgTest' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-')
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read
      pull-requests: read # The reusable Tests workflow needs PR read access.
    secrets:
      # Reusable workflows do not inherit repository secrets; pass the R2
      # cache configuration explicitly.
      KACHE_R2_ENDPOINT: ${{ secrets.KACHE_R2_ENDPOINT }}
      KACHE_R2_ACCESS_KEY_ID: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
      KACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}

  tags:
    name: Tag server releases
    needs: tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write # release-plz creates the server and internal release tags.
      pull-requests: read # release-plz reads the release PR for its changelog notes.
    outputs:
      server_tag: ${{ steps.apps.outputs.server_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@v0.5.148
        id: release
        with:
          command: release
          version: '0.3.169'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read released applications
        id: apps
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          echo "server_tag=$(jq -r '.[] | select(.package_name == "server") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  docker:
    needs: tags
    if: needs.tags.outputs.server_tag != ''
    uses: $/.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write # Publish the release image to ghcr.io.
    secrets:
      # Reusable workflows do not inherit repository secrets; pass the R2
      # cache configuration explicitly.
      KACHE_R2_ENDPOINT: ${{ secrets.KACHE_R2_ENDPOINT }}
      KACHE_R2_ACCESS_KEY_ID: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
      KACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    with:
      source_ref: ${{ needs.tags.outputs.server_tag }}
      server_tag: ${{ needs.tags.outputs.server_tag }}
