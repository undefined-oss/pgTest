name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.repository == 'undefined-oss/pgTest' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-')
    uses: ./.github/workflows/tests.yml
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}

  tags:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      cli_tag: ${{ steps.apps.outputs.cli_tag }}
      server_tag: ${{ steps.apps.outputs.server_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
          version: '0.3.169'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read released applications
        id: apps
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          echo "cli_tag=$(jq -r '.[] | select(.package_name == "cli") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
          echo "server_tag=$(jq -r '.[] | select(.package_name == "server") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  cli:
    needs: tags
    if: needs.tags.outputs.cli_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start cargo-dist on the released tag
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.tags.outputs.cli_tag }}
        run: gh workflow run cli-release.yml --repo "$GITHUB_REPOSITORY" --ref "$CLI_TAG" -f "tag=$CLI_TAG"

  docker:
    needs: tags
    if: needs.tags.outputs.server_tag != ''
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      source_ref: ${{ needs.tags.outputs.server_tag }}
      server_tag: ${{ needs.tags.outputs.server_tag }}
