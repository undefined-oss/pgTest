name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or server tag to build
        type: string
        required: true
      server_tag:
        description: Versioned server tag; empty for a nightly build
        type: string
        default: ''
      pr_build:
        description: Publish per-PR nightly tags (nightly-pr-sha) instead of the rolling nightly tags
        type: boolean
        default: false
    secrets:
      KACHE_R2_ENDPOINT:
        description: R2 S3 endpoint for the kache build cache remote
        required: false
      KACHE_R2_ACCESS_KEY_ID:
        description: R2 access key ID for the kache build cache remote
        required: false
      KACHE_R2_SECRET_ACCESS_KEY:
        description: R2 secret access key for the kache build cache remote
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve source and image metadata
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve source and version
        id: source
        env:
          SERVER_TAG: ${{ inputs.server_tag }}
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:12}"
            echo "version=${SERVER_TAG#server-v}"
          } >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable=${{ inputs.server_tag == '' && !inputs.pr_build }}
            type=ref,event=branch,prefix=nightly-,enable=${{ inputs.server_tag == '' && !inputs.pr_build }}
            type=raw,value=nightly-sha-${{ steps.source.outputs.short_sha }},enable=${{ inputs.server_tag == '' && !inputs.pr_build }}
            type=raw,value=nightly-pr-sha,enable=${{ inputs.pr_build }}
            type=raw,value=nightly-pr-sha-${{ steps.source.outputs.short_sha }},enable=${{ inputs.pr_build }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},enable=${{ inputs.server_tag != '' }}
            type=raw,value=v${{ steps.source.outputs.version }},enable=${{ inputs.server_tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.server_tag != '' && steps.source.outputs.version || 'nightly' }}

  build:
    needs: prepare
    name: Compile and verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            elf_machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-musl
            elf_machine: AArch64
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # kache keeps pull_request CI jobs read-only unless they have a remote
      # prefix of their own (kache's config clears the forced read-only when
      # pull_request_prefix resolves). Same-repo PRs then write into their
      # own namespace and keep restoring from the trusted base prefix; fork
      # PR runs have no remote at all. Other events ignore the variable.
      KACHE_PULL_REQUEST_PREFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake musl-tools pkg-config binutils
      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: '3.0.0'
          make-default: false
      - name: Install pinned Rust toolchain and musl target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      # kache caches rustc artifacts via RUSTC_WRAPPER. Same-repository runs
      # share a Cloudflare R2 remote (kache-pgtest bucket); fork PR runs
      # cannot see the credentials, so the bucket gate falls back to GitHub
      # Actions cache, keyed per musl target. PR comments are disabled: this
      # workflow only runs via workflow_call with read-only tokens.
      - name: Set up kache build cache
        uses: kunobi-ninja/kache-action@v1
        with:
          s3-bucket: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'kache-pgtest' || '' }}
          s3-endpoint: ${{ secrets.KACHE_R2_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
          save-cache: true
          cache-key-prefix: docker-release-${{ matrix.target }}
          pr-comment: false
      - name: Compile and stage static server
        env:
          PGTEST_OUTPUT_DIR: ${{ runner.temp }}/docker-context/${{ matrix.arch }}
        run: |
          sh scripts/docker-build.sh build
          echo "PGTEST_OUTPUT_DIR=$PGTEST_OUTPUT_DIR" >> "$GITHUB_ENV"
      - name: Verify architecture and runtime permissions
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
          LC_ALL: C
        run: |
          readelf -h "$PGTEST_OUTPUT_DIR/usr/local/bin/pgtest-server" | grep -F "$ELF_MACHINE"
          test "$(stat -c '%a' "$PGTEST_OUTPUT_DIR/usr/local/bin/pgtest-server")" = 755
          test "$(stat -c '%a' "$PGTEST_OUTPUT_DIR/tmp")" = 1777
      - name: Package and smoke-test native scratch image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --platform "linux/$ARCH" -f Dockerfile.cd -t pgtest-cd:verify "$RUNNER_TEMP/docker-context"
          sh scripts/docker-smoke-test.sh pgtest-cd:verify
      - name: Archive runtime filesystem
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -C "$PGTEST_OUTPUT_DIR" -cf "$RUNNER_TEMP/rootfs-$ARCH.tar" .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: server-rootfs-${{ matrix.arch }}
          path: ${{ runner.temp }}/rootfs-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Push the multi-platform image to ghcr.io.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: server-rootfs-*
          path: ${{ runner.temp }}/rootfs-artifacts
          merge-multiple: true
      - name: Prepare image context
        run: |
          for arch in amd64 arm64; do
            rootfs="$RUNNER_TEMP/docker-context/$arch"
            mkdir -p "$rootfs"
            tar --same-permissions -xf "$RUNNER_TEMP/rootfs-artifacts/rootfs-$arch.tar" -C "$rootfs"
            test "$(stat -c '%a' "$rootfs/usr/local/bin/pgtest-server")" = 755
            test "$(stat -c '%a' "$rootfs/tmp")" = 1777
          done
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-platform scratch image
        id: image
        uses: docker/build-push-action@v6.19.2
        with:
          context: ${{ runner.temp }}/docker-context
          file: Dockerfile.cd
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
      - name: Verify published platforms
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          docker buildx imagetools inspect "$tag@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/manifest.json"
