name: Tests

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Workspace tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          # The workspace already selects mold in .cargo/config.toml.
          make-default: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker is available
        run: docker info

      - name: Run workspace tests
        id: nextest
        run: cargo nextest run --locked --workspace --profile ci

      - name: Run doctests
        if: ${{ !cancelled() && (steps.nextest.outcome == 'success' || steps.nextest.outcome == 'failure') }}
        run: cargo test --locked --workspace --doc --no-fail-fast
