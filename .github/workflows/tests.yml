name: Tests

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  RUST_BACKTRACE: "1"

jobs:
  changed:
    name: Check changed files
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      # Pull request changes are read through the API, without a checkout.
      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve manual comparison
        if: github.event_name == 'workflow_dispatch'
        id: parent
        run: |
          if parent=$(git rev-parse --verify HEAD^ 2>/dev/null); then
            echo "sha=$parent" >> "$GITHUB_OUTPUT"
          fi

      - name: Examine changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # For pushes, compare with the previous push on this branch.
          # For manual runs, inspect the selected commit. Ignored for PRs.
          base: ${{ steps.parent.outputs.sha || github.ref }}
          ref: ${{ steps.parent.outputs.sha != '' && (inputs.source_sha || github.sha) || github.ref }}
          filters: |
            run_tests:
              - '**/*.rs'

  test:
    name: Workspace tests
    needs: changed
    if: needs.changed.outputs.run_tests == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          # The workspace already selects mold in .cargo/config.toml.
          make-default: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run deterministic runtime without Tokio
        run: cargo nextest run --locked -p pgtest-core --no-default-features --features test-support --profile ci

      - name: Verify Docker is available
        run: docker info

      - name: Run workspace tests
        id: nextest
        run: cargo nextest run --locked --workspace --features pgtest-core/runtime-tests --profile ci

      - name: Run doctests
        if: ${{ !cancelled() && (steps.nextest.outcome == 'success' || steps.nextest.outcome == 'failure') }}
        run: cargo test --locked --workspace --doc --no-fail-fast
