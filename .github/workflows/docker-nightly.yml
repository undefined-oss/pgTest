name: Docker nightly
run-name: >-
  Docker nightly — ${{ github.event_name == 'pull_request' &&
  format('PR #{0} {1}', github.event.pull_request.number, github.event.action) ||
  github.event_name == 'issue_comment' &&
  format('PR #{0} /bench', github.event.issue.number) || github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, closed, labeled]
  issue_comment: # zizmor: ignore[dangerous-triggers] gated to /bench commands by Afsoon; builds reviewed PR heads with read-only tokens
    types: [created]

permissions:
  contents: read
  pull-requests: read # Resolve PR head SHAs for comment- and merge-triggered builds.

# Only builds that write the shared :nightly tag need to be serialized.
# Per-PR builds publish unique nightly-pr-sha tags, so they get their own
# concurrency group and never queue behind (or get queued behind by) a
# rolling nightly build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'benchmark-v1')) && format('docker-nightly-pr-{0}', github.event.pull_request.head.sha) || 'docker-nightly' }}
  # A PR created with benchmark-v1 already attached fires both `opened` and
  # `labeled` within seconds; the later event supersedes the earlier run
  # instead of duplicating the build and the benchmark dispatch. Rolling
  # nightlies (merge, comment, dispatch) stay serialized without cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'benchmark-v1')) }}

jobs:
  resolve:
    name: Resolve nightly trigger
    # Rolling nightly builds: manual dispatch, a PR merged into main, or a
    # /bench command by Afsoon. Per-PR builds: a PR was opened, or the
    # benchmark-v1 label was added to an open PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        github.event.label.name == 'benchmark-v1' &&
        github.event.pull_request.state == 'open') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'Afsoon' &&
        github.event.comment.body == '/bench')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      pr_build: ${{ steps.resolve.outputs.pr_build }}
    steps:
      - name: Resolve source and tag mode
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          GITHUB_SHA: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$EVENT_NAME/$EVENT_ACTION" in
            workflow_dispatch/)
              # Build the dispatched branch head.
              source_ref="$GITHUB_SHA"
              pr_build=false
              ;;
            pull_request/opened|pull_request/labeled)
              # Per-PR nightly tags, built from the PR head. Labeled events
              # only reach this case for benchmark-v1 on an open PR.
              source_ref="$PR_HEAD"
              pr_build=true
              ;;
            pull_request/closed)
              # Merged into main: build the merge commit.
              source_ref="$MERGE_SHA"
              pr_build=false
              ;;
            issue_comment/created)
              # A /bench command on a PR: build the PR head as the rolling
              # nightly.
              source_ref=$(curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
                jq -r '.head.sha')
              pr_build=false
              ;;
            *)
              echo "Unhandled trigger: $EVENT_NAME/$EVENT_ACTION" >&2
              exit 1
              ;;
          esac
          if [ -z "$source_ref" ] || [ "$source_ref" = "null" ]; then
            echo "Could not resolve a commit for this trigger." >&2
            exit 1
          fi
          {
            echo "source_ref=$source_ref"
            echo "pr_build=$pr_build"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: resolve
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success'
    uses: $/.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write # Publish the nightly image to ghcr.io.
    secrets:
      # Reusable workflows do not inherit repository secrets; pass the R2
      # cache configuration explicitly.
      KACHE_R2_ENDPOINT: ${{ secrets.KACHE_R2_ENDPOINT }}
      KACHE_R2_ACCESS_KEY_ID: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
      KACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      pr_build: ${{ needs.resolve.outputs.pr_build == 'true' }}

  benchmark:
    name: Dispatch the benchmark for the new nightly images
    needs: [resolve, docker]
    # Only per-PR nightlies (PR opened, benchmark-v1 label added, or a /bench
    # command by Afsoon) carry a pgTest commit worth benchmarking;
    # merged-main nightlies would compare main against itself. The images were
    # just published by the docker job, so the dispatch cannot race the
    # registry. The PR must carry the benchmark-v1 label; anything else skips
    # the benchmark.
    if: >-
      !cancelled() &&
      needs.docker.result == 'success' &&
      ((github.event_name == 'pull_request' && github.event.action == 'opened') ||
       (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        github.event.label.name == 'benchmark-v1') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'Afsoon' &&
        github.event.comment.body == '/bench'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check the PR carries the benchmark label
        id: labeled
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json labels --jq '.labels[].name' | grep -qx 'benchmark-v1'; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER has no benchmark-v1 label; skipping the benchmark."
          fi

      - name: Dispatch the benchmark event
        if: steps.labeled.outputs.run_benchmark == 'true'
        env:
          BENCHMARK_DISPATCH_TOKEN: ${{ secrets.BENCHMARK_DISPATCH_TOKEN }}
          PR_BUILD: ${{ needs.resolve.outputs.pr_build }}
          PR_HEAD: ${{ needs.resolve.outputs.source_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          : "${BENCHMARK_DISPATCH_TOKEN:?the BENCHMARK_DISPATCH_TOKEN secret is not set}"
          head_short="${PR_HEAD:0:12}"
          # PR-opened builds just published the per-PR image; comment builds
          # published the rolling nightly built from the PR head.
          if [ "$PR_BUILD" = "true" ]; then
            pgtest_image="nightly-pr-sha-$head_short"
          else
            pgtest_image="nightly-sha-$head_short"
          fi
          main_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          pgtest_main="nightly-sha-${main_head:0:12}"
          release_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/server-v" \
            --jq '.[].ref' | sed 's|refs/tags/||' | sort -V | tail -n 1)
          if [ -z "$release_tag" ]; then
            echo "No server-v* release tag found." >&2
            exit 1
          fi
          pgtest_release="v${release_tag#server-v}"
          batch_id="benchmark-pr${PR_NUMBER}-${RUN_ID}"
          payload=$(jq -n \
            --arg image   "$pgtest_image" \
            --arg release "$pgtest_release" \
            --arg main    "$pgtest_main" \
            --arg pr      "$PR_NUMBER" \
            --arg ref     "$PR_HEAD" \
            --arg batch   "$batch_id" \
            '{event_type: "benchmark",
              client_payload: {
                pgtest_image:   $image,
                pgtest_release: $release,
                pgtest_main:    $main,
                pr_number:      $pr,
                pgtest_ref:     $ref,
                batch_id:       $batch
              }}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $BENCHMARK_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" \
            "https://api.github.com/repos/undefined-oss/pgtest-benchmark/dispatches"
          echo "dispatched batch $batch_id"
